<!DOCTYPE html>

<html lang="en" class="light">
  <head>
    <meta charset="UTF-8">
    <title>pac's website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/assets/css/reset.css"> <!-- ehhhh maybe i shouldn't have designed my stuff around this :P -->
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/main-light.css">
    <link rel="stylesheet" href="/assets/css/main-dark.css">

    <link rel="shortcut icon" href="/assets/img/favicon.png" type="image/x-icon">

    <script src="/assets/js/base.js" id="baseScript"></script>
    <script src="js/betterthan.js"></script>
  </head>
  
  <body class="centerGlass">
    <nav class="flexColumn">
      <div class="glass" id="linksDiv">
        <p class="glassTitle">links</p>

        <div class="mainWindowContent">
          <div id="coolLinks"></div>
        </div>
      </div>

      <button class="themeSwitch" onclick="switchTheme()"><img src="/assets/img/change theme.png" alt="change theme"></button>
    </nav>

    <main class="glass" id="mainWindow">
        <p class="glassTitle">is <span id="titleX">x</span> better than <span id="titleY">y</span>?</p>

        <div class="mainWindowContent">
            <p></p>

            <form id="betterthan-form">
                <label for="inputX">is </label>
                <span class="inline_flexColumn">
                    <input type="text" name="is" id="inputX" required>
                </span>

                <label for="inputY">better than </label>
                <span class="inline_flexColumn">
                    <span>
                        <input type="text" name="betterthan" id="inputY" required>?
                    </span>
                </span>

                <input type="submit" value="Check">
            </form>

            <p id="betterthan-result">no.</p>
            <img src="" alt="" id="betterthan-Ximg" width="128" height="128">
            <img src="" alt="" id="betterthan-Yimg" width="128" height="128">
        </div>
    </main>
  </body>
</html>
